<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahesh Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="matrix"></canvas>

                <img src="10.jpg">

        </div>

            <video controls>
                <source src="2.mp4" type="2.mp4">
            </video>
                        <video controls>

            </video>

            </video>

</div>

</audio>
